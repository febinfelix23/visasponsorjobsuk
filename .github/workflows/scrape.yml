name: Scrape jobs

on:
  schedule:
    # Twice a day. Each run only crawls sources that are due (12h for ATS boards, 24h for NHS Jobs).
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra flags, e.g. --ats workday --limit 20"
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Each step saves its summary here for the run report at the end.
      RUN_REPORT_DIR: ${{ github.workspace }}/.run-report
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check secrets
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Repository secret DATABASE_URL is missing. Add it under Settings → Secrets and variables → Actions → Repository secrets (Supabase transaction pooler URL, port 6543)."
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm ci
      # Flags go through an env var, never interpolated into the script, to avoid injection.
      # Idempotent: applies any change to data/seeds/job-sources.json.
      - run: npm run seed:sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run scrape -- $SCRAPE_ARGS
        env:
          SCRAPE_ARGS: ${{ inputs.args }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: AI check for ambiguous boards. Without it, they wait in the review queue.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Classifies new job titles (field of work, occupation code) with Claude Haiku 5.5.
      # Skipped without the key; scoring then falls back to the keyword rules.
      - run: npm run classify:jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Scores new and changed jobs: occupation code, seniority, salary and the sponsorship badge.
      - run: npm run score:jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Telegram run report after every run, good or bad: what it did and what needs attention.
      - name: Send run report
        if: always()
        continue-on-error: true
        run: npm run notify:run -- --workflow Scrape --status "$JOB_STATUS" --health
        env:
          JOB_STATUS: ${{ job.status }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
